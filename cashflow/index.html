<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/utility-tools/cashflow/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>webui-temp</title>
    <!-- Prefetch landing so Back to Tools loads from cache -->
    <link rel="prefetch" href="/utility-tools/" as="document" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="/utility-tools/cashflow/assets/index-CM9LGksl.js"></script>
    <link rel="stylesheet" crossorigin href="/utility-tools/cashflow/assets/index-DGd-RUB_.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Restores the path stashed by 404.html above, if any - this runs
      // once the real app's index.html has loaded, and rewrites the URL
      // back to what the person actually wanted BEFORE react-router
      // initializes, so it picks up the correct route on first render.
      (function () {
        const redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
    </script>
    <script>
      // Fire-and-forget warm-up ping — gives Render's free-tier instance
      // a head start on waking up before React even boots or getMe() fires.
      // Runs only in production (not local dev where the backend is always warm).
      var h = location.hostname;
      var isLocal = h === 'localhost' || h === '127.0.0.1' || h.startsWith('192.168.') || h.startsWith('10.') || h.startsWith('172.');
      if (!isLocal) {
        fetch('https://cashflow2-0.onrender.com/health', { method: 'GET', mode: 'no-cors', credentials: 'omit' }).catch(function(){});
      }
    </script>
  </body>
</html>
