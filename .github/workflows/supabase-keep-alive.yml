# .github/workflows/supabase-keep-alive.yml
#
# Runs daily to:
#   1. Query the users table for soft-deleted rows (genuine DB activity that
#      also resets Supabase's free-tier inactivity timer).
#   2. Hard-delete any rows whose deleted_at is more than 48 hours ago,
#      using the service_role key to bypass RLS.
#
# Appends a timestamped result line to DBaliveLog.txt and commits it so
# there is a permanent history of every run.
#
# SETUP REQUIRED:
#   SUPABASE_URL            — base project URL, e.g. https://xxxxx.supabase.co
#   SUPABASE_ANON_KEY       — anon public key (for the keep-alive query)
#   SUPABASE_SERVICE_ROLE_KEY — service_role key (for the hard-delete step)
#   Both anon and service_role keys: Project Settings -> API Keys (Legacy API Keys)

name: Supabase Keep-Alive

on:
  schedule:
    # Daily at 03:00 UTC — well inside the 7-day pause window.
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping-and-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Query soft-deleted users (keep-alive + find candidates)
        id: ping
        run: |
          response=$(curl -s -w "\n%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/users?select=id,deleted_at&deleted_at=not.is.null&limit=100" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)

          echo "Status: $status"

          if [ "$status" == "200" ]; then
            echo "✅ Keep-alive query succeeded."
            echo "result=SUCCESS" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Query failed — check SUPABASE_URL / SUPABASE_ANON_KEY, or whether RLS blocks anon reads."
            echo "Body: $body"
            echo "result=FAILURE" >> "$GITHUB_OUTPUT"
          fi

      - name: Append result to DBaliveLog.txt
        run: |
          timestamp=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          echo "$timestamp - ${{ steps.ping.outputs.result }}" >> DBaliveLog.txt

      - name: Commit and push the updated log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add DBaliveLog.txt
          git diff --staged --quiet || git commit -m "Backup log: ${{ steps.ping.outputs.result }} ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push

      - name: Process pending role/category deletions (48-hour grace period)
        if: steps.ping.outputs.result == 'SUCCESS'
        run: |
          backend_url=$(jq -r .url backend-url.json)
          response=$(curl -s -w "\n%{http_code}" \
            -X POST "$backend_url/internal/process-pending-deletions" \
            -H "X-Cleanup-Secret: ${{ secrets.CLEANUP_SECRET }}" \
            -H "Content-Type: application/json")

          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)
          echo "Cleanup endpoint HTTP status: $status"
          echo "Response: $body"

          if [ "$status" == "200" ]; then
            echo "✅ Pending deletions processed."
          else
            echo "⚠️ Cleanup endpoint returned status $status — check CLEANUP_SECRET secret and Render logs."
          fi

      - name: Fail the run if the ping itself failed
        if: steps.ping.outputs.result == 'FAILURE'
        run: exit 1
